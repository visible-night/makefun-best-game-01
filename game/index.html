<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Drift — a neon arena survival</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="page">
  <header class="masthead">
    <h1>LUMEN DRIFT</h1>
    <p class="tagline">Outlast the swarm. Feed the light.</p>
  </header>
  <div class="stage">
    <canvas id="game" width="960" height="600"></canvas>
  </div>
  <footer class="controls">
    <span><b>WASD / arrows</b> steer</span>
    <span><b>Mouse</b> aim</span>
    <span><b>Hold click</b> fire</span>
    <span><b>Space</b> dash</span>
    <span><b>E / right-click</b> nova</span>
    <span><b>P</b> pause</span>
    <span><b>M</b> mute</span>
    <span><b>R</b> restart</span>
  </footer>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
